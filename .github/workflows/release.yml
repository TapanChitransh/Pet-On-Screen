# Builds PetOnScreen for Windows and macOS and attaches the installers to a GitHub Release.
#
# Trigger: push a tag like v0.1.0 (creates/updates the release), or run manually from the
# Actions tab (builds only; artifacts are downloadable from the run).
#
# Optional repository secrets for a signed, notarized macOS build
# (Settings -> Secrets and variables -> Actions). Without them the DMGs are unsigned and
# users must right-click -> Open the first time.
#   CSC_LINK                    base64 of your "Developer ID Application" certificate exported as .p12
#   CSC_KEY_PASSWORD            password you set when exporting the .p12
#   APPLE_ID                    the Apple ID email of your developer account
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password generated at appleid.apple.com
#   APPLE_TEAM_ID               10-character Team ID from developer.apple.com/account
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (leave empty to only build)"
        required: false
        default: ""

defaults:
  run:
    working-directory: PetOnScreen

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PetOnScreen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (NSIS installer)
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: PetOnScreen-windows
          path: |
            PetOnScreen/dist/*.exe
            PetOnScreen/dist/*.blockmap
            PetOnScreen/dist/latest.yml
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            PetOnScreen/dist/*.exe
            PetOnScreen/dist/*.blockmap
            PetOnScreen/dist/latest.yml

  mac:
    name: macOS DMGs
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PetOnScreen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (arm64 + x64 DMG and zip)
        # The signing variables are exported only when the matching secret exists: electron-builder
        # treats an empty CSC_LINK as a certificate file path and fails. Without a certificate it
        # produces an unsigned, un-notarized build.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            src="SECRET_$v"
            if [ -n "${!src}" ]; then export "$v=${!src}"; fi
          done
          extra=""
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            extra="-c.mac.notarize=false"
            echo "No signing certificate configured: building unsigned DMGs"
          fi
          npx electron-builder --mac --publish never $extra
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: PetOnScreen-mac
          path: |
            PetOnScreen/dist/*.dmg
            PetOnScreen/dist/*.zip
            PetOnScreen/dist/*.blockmap
            PetOnScreen/dist/latest-mac.yml
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            PetOnScreen/dist/*.dmg
            PetOnScreen/dist/*.zip
            PetOnScreen/dist/*.blockmap
            PetOnScreen/dist/latest-mac.yml
