# Builds, signs and notarizes the macOS app on a macOS runner and attaches the DMGs to a GitHub Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CSC_LINK                    base64 of your "Developer ID Application" certificate exported as .p12
#   CSC_KEY_PASSWORD            password you set when exporting the .p12
#   APPLE_ID                    the Apple ID email of your developer account
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password generated at appleid.apple.com
#   APPLE_TEAM_ID               10-character Team ID from developer.apple.com/account
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab (unsigned build if secrets are missing).
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (arm64 + x64 DMG and zip)
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate electron-builder still produces an unsigned, un-notarized build for testing.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: PetOnScreen-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
